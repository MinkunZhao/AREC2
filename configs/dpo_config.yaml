# DPO (RecPO) Training Configuration (v2)

model:
  base_model_path: "OpenOneRec/OneRec-1.7B"
  sft_checkpoint_path: "./checkpoints/arec2-lora-r16/final"
  output_dir: "./checkpoints/arec2-dpo-r16"

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.05

data:
  recif_data_dir: "./data/recif"
  pid2sid_path: "./data/recif/video_ad_pid2sid.parquet"
  pid2sid_product_path: "./data/recif/product_pid2sid.parquet"
  preferences_dir: "./data/preferences"
  max_samples: 200000  # max samples to draw from for pair generation

# Pre-computed cards (MUST match what SFT used). 06_generate_preferences.py
# reads these so the enrichment prompt at preference-gen time == SFT/eval time.
cards_v2_dir: "./data/cards_v2"

training:
  # v2: lower beta + chosen-NLL anchoring to stop cross-task negative transfer.
  beta: 0.05            # was 0.1; lower => stays closer to SFT reference
  rpo_alpha: 1.0        # NLL-on-chosen anchoring weight; 0 disables. tune in [0.5, 1.0]
  loss_type: "sigmoid"  # keep standard DPO; do NOT switch to ipo until verified
  learning_rate: 5.0e-6
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_length: 2048
  max_prompt_length: 1792
  eval_size: 1000

stores:
  profile_store_path: "./caches/profile_store.pkl"
  label_store_path: "./caches/label_behavior_store.pkl"
  collab_store_path: "./caches/collaborative_store"
  text_store_path: "./caches/item_text_store.pkl"