# DPO (RecPO) Training Configuration

model:
  base_model_path: "OpenOneRec/OneRec-1.7B"
  sft_checkpoint_path: "./checkpoints/arec2-lora-r16/final"
  output_dir: "./checkpoints/arec2-dpo-r8"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05

data:
  recif_data_dir: "./data/recif"
  pid2sid_path: "./data/recif/video_ad_pid2sid.parquet"
  preferences_dir: "./data/preferences"
  max_samples: 100000  # max samples to draw from for pair generation

training:
  beta: 0.1
  loss_type: "sigmoid"   # was "ipo" — 先用标准 DPO 验证不退化，再换 ipo
  learning_rate: 5.0e-6
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_length: 2048
  max_prompt_length: 1792
  eval_size: 1000

stores:
  profile_store_path: "./caches/profile_store.pkl"
  label_store_path: "./caches/label_behavior_store.pkl"
  collab_store_path: "./caches/collaborative_store"
  text_store_path: "./caches/item_text_store.pkl"
